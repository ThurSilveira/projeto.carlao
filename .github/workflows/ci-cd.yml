name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: escala_ci
          POSTGRES_USER: escala_ci
          POSTGRES_PASSWORD: escala_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escala_ci -d escala_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://escala_ci:escala_ci@127.0.0.1:5432/escala_ci
      DB_SSL: "false"
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000
      AUTH_ADMIN_NAME: CI Administrator
      AUTH_ADMIN_EMAIL: admin-ci@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate ephemeral authentication credential
        run: python -c 'import os, secrets; open(os.environ["GITHUB_ENV"], "a").write(f"AUTH_ADMIN_PASSWORD={secrets.token_urlsafe(32)}\n")'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependencies and bytecode
        run: |
          python -m pip check
          python -m compileall -q app
          python -m unittest discover -s tests -v

      - name: Start API and run smoke tests
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/escala-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/public/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/escala-api.log
              exit 1
            fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/health.json")); assert data["status"] == "UP"'
          curl --fail --silent http://127.0.0.1:8080/api/openapi.json | python -m json.tool > /dev/null

          unauthenticated_status=$(curl --silent --output /tmp/unauthenticated.json --write-out "%{http_code}" \
            http://127.0.0.1:8080/api/ministros)
          test "$unauthenticated_status" = "401"

          curl --fail --silent --show-error \
            --dump-header /tmp/login.headers \
            --output /tmp/login.json \
            --request POST \
            --url http://127.0.0.1:8080/api/auth/login \
            --header "Content-Type: application/json" \
            --header "Origin: http://localhost:3000" \
            --data "$(jq -nc --arg email "$AUTH_ADMIN_EMAIL" --arg password "$AUTH_ADMIN_PASSWORD" '{email: $email, senha: $password}')"
          csrf_token=$(jq -er '.csrfToken' /tmp/login.json)
          session_cookie=$(awk 'BEGIN { IGNORECASE=1 } /^set-cookie: __Host-escala_session=/ { sub(/\r$/, ""); split($2, parts, ";"); print parts[1] }' /tmp/login.headers)
          test -n "$session_cookie"
          jq -e '.usuario.perfil == "ADMINISTRADOR" and .usuario.protegido == true' /tmp/login.json > /dev/null

          curl --fail --silent --show-error \
            --cookie "$session_cookie" \
            http://127.0.0.1:8080/api/usuarios/perfis \
            | jq -e 'length == 4' > /dev/null

          missing_csrf_status=$(curl --silent --output /tmp/missing-csrf.json --write-out "%{http_code}" \
            --request DELETE \
            --cookie "$session_cookie" \
            http://127.0.0.1:8080/api/usuarios/1)
          test "$missing_csrf_status" = "403"

          protected_admin_status=$(curl --silent --output /tmp/protected-admin.json --write-out "%{http_code}" \
            --request DELETE \
            --cookie "$session_cookie" \
            --header "X-CSRF-Token: $csrf_token" \
            http://127.0.0.1:8080/api/usuarios/1)
          test "$protected_admin_status" = "400"

  docker:
    name: Docker (${{ matrix.component }})
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            build_args: |
              VITE_API_URL=/api
              VITE_ENV=production
          - component: backend
            context: backend
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-vercel:
    name: Deploy Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-frontend
      url: https://escala-ministerial.vercel.app
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: https://escala-ministerial.vercel.app
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Verify deployment secrets
        run: test -n "$VERCEL_DEPLOY_HOOK_URL"

      - name: Trigger main deployment
        run: |
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "$VERCEL_DEPLOY_HOOK_URL")
          jq -e '.job.id and (.job.state == "PENDING")' <<< "$response" > /dev/null

      - name: Wait for exact commit in production
        run: |
          for attempt in {1..90}; do
            html=$(curl --fail --silent --show-error "$PRODUCTION_URL" || true)
            if grep --fixed-strings --quiet "name=\"build-commit\" content=\"$COMMIT_SHA\"" <<< "$html"; then
              echo "Vercel published commit $COMMIT_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel did not publish commit $COMMIT_SHA before timeout"
          exit 1

  deploy-render:
    name: Deploy Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-backend
      url: https://escala-ministerial-api.onrender.com
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Verify deployment secrets
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"

      - name: Trigger exact commit deployment
        id: deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          payload=$(jq -nc --arg commit "$COMMIT_SHA" '{commitId: $commit}')
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          deploy_id=$(jq -er '.id' <<< "$response")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          for attempt in {1..90}; do
            status=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Render status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "Render deployment timed out"
          exit 1

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error https://escala-ministerial-api.onrender.com/api/public/health
          protected_status=$(curl --silent --output /tmp/render-protected.json --write-out "%{http_code}" \
            https://escala-ministerial-api.onrender.com/api/ministros)
          test "$protected_status" = "401"
